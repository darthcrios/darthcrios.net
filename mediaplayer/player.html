<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Críos Music Network | Media Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="playerstyle.css" />
  <meta name="description" content="Listen to original Críos tracks in the Críos Music Network media player." />
</head>
<body>

<!-- HEADER -->
  <header class="hero scope-header">
    <canvas id="scopeCanvas" aria-hidden="true"></canvas>

    <div class="scope-ui">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">Críos</span>
        <span class="tag">OSC // ONLINE</span>
      </div>

<nav class="scope-nav" aria-label="Primary">
  <a href="../index.html" data-wave="sine">Home</a>
  <a href="../blog.html" data-wave="triangle">Blog</a>
  <a href="../projects.html" data-wave="saw">Projects</a>
  <a href="../terminalplugin/index.html" data-wave="square">Terminal</a>
  <a href="https://darthcrios.bandcamp.com/" data-wave="sine">Music Store</a>
</nav>


    </div>
  </header>

  <div class="app">
    <div class="titlebar">
      <div class="title-left">
        <span class="app-icon"></span>
        <span class="title-text">Críos Media Player</span>
      </div>
    </div>

    

    <div class="main">
      <div class="left">
        <div class="nowplaying">
          <div class="cover-wrap">
            <img id="cover" alt="Current track artwork" />
            <div class="gloss"></div>
          </div>

          <div class="meta">
            <div id="trackTitle" class="track-title">—</div>
            <div id="trackArtist" class="track-artist">—</div>
          </div>

          <div class="viz">
            <canvas id="vizCanvas" width="310" height="62"></canvas>
          </div>
        </div>

        <div class="transport">
          <div class="time-row">
            <span id="timeCur" class="time">0:00</span>
            <div class="seek-wrap">
              <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek through track" />
            </div>
            <span id="timeDur" class="time">0:00</span>
          </div>

          <div class="btn-row">
            <button id="btnPrev" class="ctrl" title="Previous">⏮</button>
            <button id="btnPlay" class="ctrl big" title="Play/Pause">▶</button>
            <button id="btnNext" class="ctrl" title="Next">⏭</button>

            <div class="spacer"></div>

            <button id="btnShuffle" class="pill" title="Shuffle" aria-pressed="false">Shuffle</button>
            <button id="btnRepeat" class="pill" title="Repeat" aria-pressed="false">Repeat</button>

          </div>

          <!-- Volume has its own row so it never crowds the transport buttons. -->
          <div class="volume-row" role="group" aria-label="Volume controls">
            <button id="btnMute" class="volume-mute" type="button" aria-label="Mute audio" aria-pressed="false" title="Mute or unmute">🔊</button>
            <label for="vol" class="volume-label">Volume</label>
            <input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume" />
            <output id="volumeValue" for="vol">85%</output>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="panel-head">
          <span>Playlist</span>
          
        </div>

        <div id="playlist" class="playlist"></div>
      </div>
    </div>

    <div class="statusbar">
      <span id="statusText" role="status" aria-live="polite">Ready.</span>
      <span class="status-right">CRÍOS // ONLINE</span>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script src="../scope.js"></script>
  <script src="player.js"></script>
</body>
</html>
